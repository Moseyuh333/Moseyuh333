<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Focus areas and counters">
  <rect width="400" height="320" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3be8ff">Signal board</text>

  <!-- counters -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="90" y="100" font-size="30" font-weight="bold" fill="#52f0a8">37</text>
    <text x="90" y="120" font-size="11" fill="#8b949e">public repos</text>

    <text x="200" y="100" font-size="30" font-weight="bold" fill="#ff7ad9">5</text>
    <text x="200" y="120" font-size="11" fill="#8b949e">PRs merged upstream</text>

    <text x="310" y="100" font-size="30" font-weight="bold" fill="#3be8ff">6</text>
    <text x="310" y="120" font-size="11" fill="#8b949e">stars earned</text>
  </g>

  <!-- focus list -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c9d1d9">
    <rect x="24" y="146" width="352" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="42" cy="163" r="5" fill="#ff6b6b"/>
    <text x="58" y="168">Incident response &amp; SOAR automation</text>

    <rect x="24" y="188" width="352" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="42" cy="205" r="5" fill="#ffd93d"/>
    <text x="58" y="210">Network traffic analysis — Wireshark / tcpdump</text>

    <rect x="24" y="230" width="352" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="42" cy="247" r="5" fill="#52f0a8"/>
    <text x="58" y="252">CCNA: switching, VLANs, routing</text>

    <rect x="24" y="272" width="352" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="42" cy="289" r="5" fill="#a78bfa"/>
    <text x="58" y="294">Bluetooth Classic vuln research (BlueToolkit)</text>
  </g>
</svg>
