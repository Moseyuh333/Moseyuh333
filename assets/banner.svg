    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.85;0.95;1" dur="11s" begin="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="520" y="165" font-size="12.5" fill="#8ea0ff" opacity="0">6294 skill_collector v2
