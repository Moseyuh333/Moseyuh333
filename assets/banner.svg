<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Anime network security banner">
  <defs>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#41288f"/>
    </linearGradient>
    <linearGradient id="bangG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d79ff"/>
      <stop offset="1" stop-color="#5a3fd0"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3be8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3be8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="400" cy="210" rx="250" ry="160" fill="url(#glowG)"/>

  <!-- LEFT network graph -->
  <g stroke="#3be8ff" stroke-opacity="0.25" fill="none" stroke-width="1.5">
    <path d="M70,95 L180,52 L262,98"/>
    <path d="M70,95 L128,158 L214,132"/>
    <path d="M214,132 L262,98"/>
  </g>
  <g fill="#3be8ff">
    <circle cx="70" cy="95" r="5" opacity="0.9"/>
    <circle cx="180" cy="52" r="5" opacity="0.9"/>
    <circle cx="262" cy="98" r="5" opacity="0.9"/>
    <circle cx="128" cy="158" r="5" opacity="0.9"/>
    <circle cx="214" cy="132" r="5" opacity="0.9"/>
  </g>
  <g fill="none" stroke="#3be8ff" stroke-opacity="0.3">
    <circle cx="70" cy="95" r="10"/>
    <circle cx="180" cy="52" r="10"/>
    <circle cx="262" cy="98" r="10"/>
  </g>
  <circle r="3" fill="#aef7ff">
    <animateMotion path="M70,95 L180,52 L262,98" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#7cd7ff">
    <animateMotion path="M70,95 L128,158 L214,132" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- RIGHT network graph (pink) -->
  <g stroke="#ff7ad9" stroke-opacity="0.25" fill="none" stroke-width="1.5">
    <path d="M730,88 L622,50 L540,96"/>
    <path d="M730,88 L668,150 L588,134"/>
    <path d="M588,134 L540,96"/>
  </g>
  <g fill="#ff7ad9">
    <circle cx="730" cy="88" r="5" opacity="0.9"/>
    <circle cx="622" cy="50" r="5" opacity="0.9"/>
    <circle cx="540" cy="96" r="5" opacity="0.9"/>
    <circle cx="668" cy="150" r="5" opacity="0.9"/>
    <circle cx="588" cy="134" r="5" opacity="0.9"/>
  </g>
  <g fill="none" stroke="#ff7ad9" stroke-opacity="0.3">
    <circle cx="730" cy="88" r="10"/>
    <circle cx="622" cy="50" r="10"/>
  </g>
  <circle r="3" fill="#ffc4ec">
    <animateMotion path="M730,88 L622,50 L540,96" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- drifting binary -->
  <g font-family="Consolas,'Courier New',monospace" font-size="13" fill="#8ea0ff">
    <text x="80" y="345" opacity="0">1010
      <animate attributeName="y" values="345;240" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="135" y="345" opacity="0">0110
      <animate attributeName="y" values="345;250" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="690" y="345" opacity="0">0101
      <animate attributeName="y" values="345;245" dur="8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="635" y="345" opacity="0">1100
      <animate attributeName="y" values="345;255" dur="9s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- sakura petals -->
  <g>
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
        <path d="M0,-7 C4,-4 4,2 0,7 C-4,2 -4,-4 0,-7Z" fill="#ff9ed6" opacity="0.85"/>
      </g>
      <animateMotion path="M150,-10 C165,60 130,120 150,190 C168,250 135,310 150,420" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="3.6s" repeatCount="indefinite"/>
        <path d="M0,-6 C3.4,-3.4 3.4,1.7 0,6 C-3.4,1.7 -3.4,-3.4 0,-6Z" fill="#ffc4ec" opacity="0.8"/>
      </g>
      <animateMotion path="M310,-10 C295,80 325,150 300,230 C285,300 315,360 305,420" dur="9s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.2s" repeatCount="indefinite"/>
        <path d="M0,-7 C4,-4 4,2 0,7 C-4,2 -4,-4 0,-7Z" fill="#ff9ed6" opacity="0.85"/>
      </g>
      <animateMotion path="M655,-10 C640,70 670,140 650,220 C635,290 665,350 655,420" dur="8s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4s" repeatCount="indefinite"/>
        <path d="M0,-5 C2.8,-2.8 2.8,1.4 0,5 C-2.8,1.4 -2.8,-2.8 0,-5Z" fill="#ffc4ec" opacity="0.75"/>
      </g>
      <animateMotion path="M520,-10 C530,90 505,160 525,260 C540,330 515,380 522,420" dur="10s" begin="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating hearts -->
  <g transform="translate(560,238)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0,-3 C-2.5,-8 -9,-6 -9,-1.5 C-9,3 -3.5,6.5 0,9 C3.5,6.5 9,3 9,-1.5 C9,-6 2.5,-8 0,-3Z" fill="#ff7ad9" opacity="0.9"/>
    </g>
  </g>
  <g transform="translate(244,150)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      <path d="M0,-3 C-2.5,-8 -9,-6 -9,-1.5 C-9,3 -3.5,6.5 0,9 C3.5,6.5 9,3 9,-1.5 C9,-6 2.5,-8 0,-3Z" fill="#3be8ff" opacity="0.8"/>
    </g>
  </g>

  <!-- ===== girl ===== -->
  <g>
    <!-- twintails -->
    <path d="M310,140 C265,160 250,210 262,258 C268,278 282,292 300,296 C286,266 282,220 312,158Z" fill="url(#hairG)" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-2.5 310 140;2.5 310 140;-2.5 310 140" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M490,140 C535,160 550,210 538,258 C532,278 518,292 500,296 C514,266 518,220 488,158Z" fill="url(#hairG)" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="2.5 490 140;-2.5 490 140;2.5 490 140" dur="3.6s" repeatCount="indefinite"/>
    </path>

    <!-- back hair -->
    <path d="M400,86 C326,86 296,142 296,196 C296,232 314,252 336,258 L464,258 C486,252 504,232 504,196 C504,142 474,86 400,86Z" fill="url(#hairG)"/>

    <!-- ahoge -->
    <path d="M398,90 C392,70 404,58 418,64 C428,69 424,82 412,88" fill="none" stroke="#7c5cff" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 400 92;5 400 92;-5 400 92" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <!-- face -->
    <ellipse cx="400" cy="200" rx="76" ry="66" fill="#ffe4d6"/>

    <!-- headphones -->
    <path d="M310,158 C310,96 490,96 490,158" fill="none" stroke="#241a4e" stroke-width="13" stroke-linecap="round"/>
    <rect x="286" y="150" width="30" height="52" rx="14" fill="#241a4e"/>
    <circle cx="301" cy="176" r="12" fill="none" stroke="#3be8ff" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="484" y="150" width="30" height="52" rx="14" fill="#241a4e"/>
    <circle cx="499" cy="176" r="12" fill="none" stroke="#ff7ad9" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- bangs -->
    <path d="M300,186 C302,128 330,102 352,130 C362,104 382,102 394,132 C404,106 424,106 434,134 C448,108 470,112 476,136 C490,120 498,150 498,186 C470,168 440,162 400,163 C360,164 330,170 300,186Z" fill="url(#bangG)"/>

    <!-- eyebrows -->
    <path d="M344,176 q 12,-7 26,-3" stroke="#4a2fa8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M430,173 q 14,-4 26,3" stroke="#4a2fa8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- left eye -->
    <g>
      <ellipse cx="360" cy="205" rx="14" ry="17" fill="#28c8ff">
        <animate attributeName="ry" values="17;17;1.2;17;17" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="360" cy="205" rx="14" ry="17" fill="none" stroke="#1b2a4a" stroke-width="2">
        <animate attributeName="ry" values="17;17;1.2;17;17" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="355" cy="199" r="4.5" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0.1;1;1" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="366" cy="213" r="2" fill="#ffffff" opacity="0.8"/>
      <path d="M344,194 q 14,-9 30,-3" stroke="#241a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- right eye -->
    <g>
      <ellipse cx="440" cy="205" rx="14" ry="17" fill="#28c8ff">
        <animate attributeName="ry" values="17;17;1.2;17;17" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="440" cy="205" rx="14" ry="17" fill="none" stroke="#1b2a4a" stroke-width="2">
        <animate attributeName="ry" values="17;17;1.2;17;17" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="435" cy="199" r="4.5" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0.1;1;1" keyTimes="0;0.44;0.47;0.5;1" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="446" cy="213" r="2" fill="#ffffff" opacity="0.8"/>
      <path d="M426,191 q 16,-6 30,3" stroke="#241a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="332" cy="228" rx="11" ry="5.5" fill="#ff9ecf" opacity="0.75"/>
    <ellipse cx="468" cy="228" rx="11" ry="5.5" fill="#ff9ecf" opacity="0.75"/>

    <!-- cat mouth -->
    <path d="M392,232 q 4,5 8,0 q 4,5 8,0" stroke="#c2607f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- hoodie collar -->
    <path d="M338,252 Q400,276 462,252 L462,262 Q400,288 338,262Z" fill="#33205c"/>
  </g>

  <!-- ===== laptop ===== -->
  <g>
    <rect x="262" y="246" width="276" height="118" rx="12" fill="#0d1430" stroke="#3be8ff" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="272" y="256" width="256" height="98" rx="6" fill="#050a1c"/>
    <g font-family="Consolas,'Courier New',monospace" font-size="13" fill="#52f0a8">
      <text x="282" y="276" opacity="0">$ whoami<animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.25s" fill="freeze"/></text>
      <text x="282" y="294" opacity="0" fill="#3be8ff">&gt; network_defender @ HCMUTE<animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.25s" fill="freeze"/></text>
      <text x="282" y="312" opacity="0" fill="#8ea0ff">$ ./incident-orchestrator --auto<animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.25s" fill="freeze"/></text>
      <text x="282" y="330" opacity="0" fill="#ff9ed6">[ok] 0 threats - packets filtered<animate attributeName="opacity" values="0;1" begin="2s" dur="0.25s" fill="freeze"/></text>
      <rect x="282" y="338" width="8" height="12" fill="#52f0a8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="272" y="256" width="256" height="10" fill="#3be8ff" opacity="0.08">
      <animate attributeName="y" values="256;344;256" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="246" y="364" width="308" height="14" rx="7" fill="#1b2547"/>
  </g>
</svg>
