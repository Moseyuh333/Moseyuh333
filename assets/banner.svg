    <circle cx="293" cy="213" r="1.8" fill="#ffffff" opacity="0.8"/>
    <path d="M273,195 q13,-8 27,-3" stroke="#241a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right eye -->
  <g>
    <ellipse cx="353" cy="205" rx="13.5" ry="16.5" fill="#28c8ff">
      <animate attributeName="ry" values="16.5;16.5;1.2;16.5;16.5" keyTimes="0;0.43;0.46;0.49;1" dur="4.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="353" cy="205" rx="13.5" ry="16.5" fill="none" stroke="#1b2a4a" stroke-width="2">
