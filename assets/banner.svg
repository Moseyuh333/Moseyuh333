  <path d="M232,168 C192,188 182,234 194,274 C202,292 214,304 230,308 C220,280 216,240 238,184 Z" fill="url(#hairG)">
    <animateTransform attributeName="transform" type="rotate" values="-3 232 168;3 232 168;-3 232 168" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <path d="M408,168 C448,188 458,234 446,274 C438,292 426,304 410,308 C420,280 424,240 402,184 Z" fill="url(#hairG)">
    <animateTransform attributeName="transform" type="rotate" values="3 408 168;-3 408 168;3 408 168" dur="4.2s" repeatCount="indefinite"/>
  </path>

  <!-- back hair -->
  <path d="M320,104 C252,104 224,158 224,213 C224,249 242,272 264,278 L376,278 C398,272 416,249 416,213 C416,158 388,104 320,104 Z" fill="url(#hairG)"/>

  <!-- ahoge -->
