  <circle cx="226" cy="190" r="10" fill="none" stroke="#3be8ff" stroke-width="2.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="400" y="166" width="28" height="48" rx="13" fill="#241a4e"/>
  <circle cx="414" cy="190" r="10" fill="none" stroke="#ff7ad9" stroke-width="2.5">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- bangs -->
  <path d="M224,204 C226,152 252,128 272,155 C281,130 298,128 308,157 C317,132 334,132 342,159 C354,134 374,138 379,162 C392,146 402,172 404,204 C378,188 352,183 320,184 C288,185 252,190 224,204 Z" fill="url(#bangG)"/>

