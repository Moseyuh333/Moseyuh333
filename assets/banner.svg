    <animateTransform attributeName="transform" type="rotate" values="-6 320 108;6 320 108;-6 320 108" dur="2.9s" repeatCount="indefinite"/>
  </path>

  <!-- face -->
  <ellipse cx="320" cy="200" rx="66" ry="58" fill="#ffe4d6"/>

  <!-- headphones -->
