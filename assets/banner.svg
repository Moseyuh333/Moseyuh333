    <rect x="22" y="-22" width="6" height="22" rx="3" fill="#52f0a8"><animate attributeName="height" values="22;32;6;28;22" dur="0.85s" begin="0.24s" repeatCount="indefinite"/><animate attributeName="y" values="-22;-32;-6;-28;-22" dur="0.85s" begin="0.24s" repeatCount="indefinite"/></rect>
  </g>
</g>

