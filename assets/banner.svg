<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Moseyuh333 — code, fire, neon">
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080512"/>
    <stop offset="0.55" stop-color="#140a26"/>
    <stop offset="1" stop-color="#1e0d33"/>
  </linearGradient>
  <radialGradient id="hotGlow" cx="0.5" cy="1" r="0.75">
    <stop offset="0" stop-color="#ff6b35" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="girlGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ff2d75" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#ff2d75" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07cff"/>
    <stop offset="1" stop-color="#4a2a99"/>
  </linearGradient>
  <linearGradient id="bangG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c99fff"/>
    <stop offset="1" stop-color="#6a44d8"/>
  </linearGradient>
  <linearGradient id="flameBack" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff2d75" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ff6b35" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#ffd93d" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="flameFront" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ffd93d" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="800" height="420" fill="url(#bgG)"/>
<rect width="800" height="420" fill="url(#hotGlow)"/>

<!-- starfield -->
<g fill="#c9d1d9">
  <circle cx="62" cy="42" r="2"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="148" cy="74" r="1.6"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="252" cy="30" r="2.2"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.7s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="428" cy="56" r="1.8"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="512" cy="24" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="648" cy="46" r="1.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.3s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="742" cy="82" r="2.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.9s" begin="2s" repeatCount="indefinite"/></circle>
</g>

<!-- giant katakana watermark: コード (code) -->
<text x="400" y="316" text-anchor="middle" font-size="196" font-weight="700" fill="#7c4dff" opacity="0.07"
      font-family="'Hiragino Kaku Gothic Pro','Yu Gothic',Meiryo,sans-serif">コード</text>

<!-- floating code glyphs -->
<g font-family="Consolas,'Courier New',monospace">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.8s" repeatCount="indefinite"/>
    <text x="62" y="134" font-size="34" fill="#ff6b35">&lt;/&gt;</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
    <text x="156" y="198" font-size="24" fill="#3be8ff" opacity="0.9">{ }</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    <text x="52" y="272" font-size="20" fill="#ff7ad9">()=&gt;</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
    <text x="150" y="322" font-size="17" fill="#a78bfa">0x1F</text>
  </g>
</g>

<!-- soft glow behind girl -->
<ellipse cx="320" cy="235" rx="200" ry="165" fill="url(#girlGlow)"/>

<!-- ============ girl (anime coder) ============ -->
<g>
