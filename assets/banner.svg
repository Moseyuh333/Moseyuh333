<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Anime network security girl at radar console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f2e"/>
      <stop offset="0.55" stop-color="#101742"/>
      <stop offset="1" stop-color="#0a0f2e"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#3d2596"/>
    </linearGradient>
    <linearGradient id="bangG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a583ff"/>
      <stop offset="1" stop-color="#5a3fd0"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3be8ff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#3be8ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3be8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="girlGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- grid backdrop -->
  <g stroke="#2a3a8a" stroke-opacity="0.25" stroke-width="1">
    <path d="M0,80 H800 M0,160 H800 M0,240 H800 M0,320 H800 M0,400 H800"/>
    <path d="M100,0 V480 M200,0 V480 M300,0 V480 M400,0 V480 M500,0 V480 M600,0 V480 M700,0 V480"/>
  </g>

  <!-- radar sweep -->
  <g transform="translate(140,150)">
    <circle r="92" fill="url(#radarGlow)"/>
    <circle r="92" fill="none" stroke="#3be8ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#3be8ff" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="30" fill="none" stroke="#3be8ff" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M0,0 L0,-92 A92,92 0 0 1 65,-65 Z" fill="#3be8ff" opacity="0.14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="0" y2="-92" stroke="#3be8ff" stroke-opacity="0.6" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- blips -->
    <g>
      <circle cx="40" cy="-25" r="4" fill="#ff7ad9">
        <animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="30" r="3.5" fill="#52f0a8">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-45" cy="-40" r="3" fill="#3be8ff">
        <animate attributeName="opacity" values="1;0.2;1" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="4" fill="#9df2ff"/>
  </g>

  <!-- terminal card right -->
  <g font-family="Consolas,'Courier New',monospace" font-size="13">
    <rect x="510" y="72" width="250" height="164" rx="10" fill="#0d1430" stroke="#3be8ff" stroke-opacity="0.4"/>
    <rect x="510" y="72" width="250" height="24" rx="10" fill="#1b2547"/>
    <circle cx="524" cy="84" r="4" fill="#ff6b6b"/>
    <circle cx="538" cy="84" r="4" fill="#ffd93d"/>
    <circle cx="552" cy="84" r="4" fill="#52f0a8"/>
    <text x="524" y="120" fill="#52f0a8" opacity="0">$ tcpdump -i eth0<animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.2s" fill="freeze"/></text>
    <text x="524" y="140" fill="#3be8ff" opacity="0">listening on eth0...<animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.2s" fill="freeze"/></text>
    <text x="524" y="160" fill="#8ea0ff" opacity="0">[SYN] 10.0.0.42:443<animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.2s" fill="freeze"/></text>
    <text x="524" y="180" fill="#8ea0ff" opacity="0">[ACK] 10.0.0.42:443 ✓<animate attributeName="opacity" values="0;1" begin="2s" dur="0.2s" fill="freeze"/></text>
    <text x="524" y="200" fill="#ff7ad9" opacity="0">0 anomalies detected<animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.2s" fill="freeze"/></text>
    <text x="524" y="220" fill="#52f0a8" opacity="0">_.<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
  </g>

  <!-- drifting packet glyphs -->
  <g font-family="Consolas, monospace" font-size="12" fill="#3be8ff">
    <text x="360" y="60" opacity="0">[SYN]<animate attributeName="x" values="360;600" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.3;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="360" y="430" opacity="0">[ACK]<animate attributeName="x" values="360;130" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.3;1" dur="8s" begin="2s" repeatCount="indefinite"/></text>
    <text x="200" y="440" opacity="0">0x1F<animate attributeName="x" values="200;40" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" keyTimes="0;0.3;1" dur="6s" begin="4s" repeatCount="indefinite"/></text>
  </g>

  <!-- sakura petals -->
  <g>
    <g>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
        <path d="M0,-7 C4,-4 4,2 0,7 C-4,2 -4,-4 0,-7Z" fill="#ff9ed6" opacity="0.85"/></g>
      <animateMotion path="M40,-10 C55,80 30,160 50,250 C65,330 35,410 45,500" dur="8s" repeatCount="indefinite"/>
    </g>
    <g>
      <g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="3.6s" repeatCount="indefinite"/>
        <path d="M0,-6 C3.4,-3.4 3.4,1.7 0,6 C-3.4,1.7 -3.4,-3.4 0,-6Z" fill="#ffc4ec" opacity="0.8"/></g>
      <animateMotion path="300,-10 C285,90 315,180 290,270 C275,350 305,430 295,500" dur="10s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.2s" repeatCount="indefinite"/>
        <path d="M0,-5 C2.8,-2.8 2.8,1.4 0,5 C-2.8,1.4 -2.8,-2.8 0,-5Z" fill="#ff9ed6" opacity="0.75"/></g>
      <animateMotion path="M480,-10 C495,100 465,190 485,290 C500,370 470,450 480,500" dur="9s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4s" repeatCount="indefinite"/>
        <path d="M0,-7 C4,-4 4,2 0,7 C-4,2 -4,-4 0,-7Z" fill="#ffc4ec" opacity="0.8"/></g>
      <animateMotion path="M700,-10 C685,80 715,170 690,260 C675,340 705,420 695,500" dur="8.5s" begin="3.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= girl ================= -->
  <ellipse cx="400" cy="255" rx="230" ry="200" fill="url(#girlGlow)"/>
  <g>
    <!-- twintails -->
    <path d="M296,190 C248,215 235,270 250,320 C258,342 274,356 292,360 C280,328 276,278 300,208Z" fill="url(#hairG)">
      <animateTransform attributeName="transform" type="rotate" values="-3 296 190;3 296 190;-3 296 190" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M504,190 C552,215 565,270 550,320 C542,342 526,356 508,360 C520,328 524,278 500,208Z" fill="url(#hairG)">
      <animateTransform attributeName="transform" type="rotate" values="3 504 190;-3 504 190;3 504 190" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- back hair -->
    <path d="M400,120 C322,120 292,180 292,240 C292,280 312,302 336,308 L464,308 C488,302 508,280 508,240 C508,180 478,120 400,120Z" fill="url(#hairG)"/>

    <!-- ahoge -->
    <path d="M398,124 C392,102 406,90 422,96 C432,101 428,116 414,122" fill="none" stroke="#7c5cff" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-6 400 126;6 400 126;-6 400 126" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- face -->
    <ellipse cx="400" cy="242" rx="78" ry="68" fill="#ffe4d6"/>

    <!-- headphones -->
    <path d="M308,196 C308,130 492,130 492,196" fill="none" stroke="#241a4e" stroke-width="13" stroke-linecap="round"/>
    <rect x="284" y="188" width="32" height="56" rx="15" fill="#241a4e"/>
    <circle cx="300" cy="216" r="12" fill="none" stroke="#3be8ff" stroke-width="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="484" y="188" width="32" height="56" rx="15" fill="#241a4e"/>
    <circle cx="500" cy="216" r="12" fill="none" stroke="#ff7ad9" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- bangs -->
    <path d="M298,230 C300,168 330,140 352,170 C362,142 382,140 394,172 C404,144 424,144 434,174 C448,146 470,150 476,176 C490,158 500,190 502,230 C472,210 440,204 400,205 C360,206 328,212 298,230Z" fill="url(#bangG)"/>

    <!-- eyebrows -->
    <path d="M342,216 q 12,-7 26,-3" stroke="#4a2fa8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M430,213 q 14,-4 26,3" stroke="#4a2fa8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- left eye -->
    <g>
      <ellipse cx="358" cy="247" rx="14.5" ry="17.5" fill="#28c8ff">
        <animate attributeName="ry" values="17.5;17.5;1.2;17.5;17.5" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="358" cy="247" rx="14.5" ry="17.5" fill="none" stroke="#1b2a4a" stroke-width="2">
        <animate attributeName="ry" values="17.5;17.5;1.2;17.5;17.5" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="353" cy="241" r="4.5" fill="#fff">
        <animate attributeName="opacity" values="1;1;0.1;1;1" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="364" cy="255" r="2" fill="#fff" opacity="0.8"/>
      <path d="M342,236 q 14,-9 30,-3" stroke="#241a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- right eye -->
    <g>
      <ellipse cx="442" cy="247" rx="14.5" ry="17.5" fill="#28c8ff">
        <animate attributeName="ry" values="17.5;17.5;1.2;17.5;17.5" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="442" cy="247" rx="14.5" ry="17.5" fill="none" stroke="#1b2a4a" stroke-width="2">
        <animate attributeName="ry" values="17.5;17.5;1.2;17.5;17.5" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="437" cy="241" r="4.5" fill="#fff">
        <animate attributeName="opacity" values="1;1;0.1;1;1" keyTimes="0;0.44;0.47;0.5;1" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="448" cy="255" r="2" fill="#fff" opacity="0.8"/>
      <path d="M428,233 q 16,-6 30,3" stroke="#241a4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="330" cy="271" rx="11" ry="5.5" fill="#ff9ecf" opacity="0.75"/>
    <ellipse cx="470" cy="271" rx="11" ry="5.5" fill="#ff9ecf" opacity="0.75"/>

    <!-- cat mouth -->
    <path d="M392,276 q 4,5 8,0 q 4,5 8,0" stroke="#c2607f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- hoodie -->
    <path d="M330,300 Q400,330 470,300 L474,318 Q400,350 326,318Z" fill="#33205c"/>
  </g>

  <!-- console desk -->
  <rect x="180" y="380" width="440" height="18" rx="9" fill="#1b2547"/>
  <!-- small equalizer on desk -->
  <g>
    <rect x="600" y="330" width="8" height="42" rx="3" fill="#3be8ff" opacity="0.9">
      <animate attributeName="height" values="42;14;42" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;358;330" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="614" y="330" width="8" height="42" rx="3" fill="#ff7ad9" opacity="0.9">
      <animate attributeName="height" values="42;20;42" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;352;330" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="628" y="330" width="8" height="42" rx="3" fill="#52f0a8" opacity="0.9">
      <animate attributeName="height" values="42;8;42" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;364;330" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
